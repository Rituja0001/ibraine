name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "--- Navigating to project directory ---"
            cd /root/ibraine-website

            echo "--- Resetting local working tree ---"
            git config core.fileMode false
            git reset --hard HEAD
            git clean -fd

            echo "--- Pulling latest changes from origin/main ---"
            git pull origin main

            echo "--- Installing dependencies and building production assets ---"
            npm install
            npm run build

            echo "--- Setting permissions for Nginx ---"
            chown -R www-data:www-data /root/ibraine-website/dist
            chmod -R 755 /root/ibraine-website/dist

            echo "--- Validating Nginx and reloading ---"
            nginx -t
            systemctl reload nginx

            echo "=== Deployment to ibraine.com completed successfully! ==="
